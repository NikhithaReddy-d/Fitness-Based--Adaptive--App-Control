<!doctype html>
<html>
<head>
    <title>Reminders - System Access</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase.js"></script>

    <div class="nav-header">
        <div class="brand" style="font-family:'Orbitron'; color:#00d4ff;">FITNESS REMINDERS</div>
        <div class="nav-links">
            <a href="menu.html" class="nav-link">MENU</a>
            <a href="dashboard.html" class="nav-link">DASHBOARD</a>
            <a href="profile.html" class="nav-link">PROFILE</a>
            <a href="activity.html" class="nav-link">ACTIVITY</a>
            <a href="history.html" class="nav-link">HISTORY</a>
            <a href="reminders.html" class="nav-link active">REMINDERS</a>
            <a href="admin.html" class="nav-link">ADMIN</a>
            <button id="logout" style="clip-path:none; padding:5px 15px;">LOGOUT</button>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="reminders-container">
            <div class="add-reminder card">
                <h2 style="font-family:'Orbitron'; color:#00d4ff;">SET NEW REMINDER</h2>
                
                <div class="form-group">
                    <label>REMINDER TITLE</label>
                    <input type="text" id="reminderTitle" placeholder="e.g., Morning Run">
                </div>

                <div class="form-group">
                    <label>ACTIVITY TYPE</label>
                    <select id="reminderType">
                        <option value="running">RUNNING</option>
                        <option value="walking">WALKING</option>
                        <option value="cycling">CYCLING</option>
                        <option value="swimming">SWIMMING</option>
                        <option value="workout">WORKOUT</option>
                        <option value="yoga">YOGA</option>
                        <option value="stretching">STRETCHING</option>
                        <option value="other">OTHER</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>TIME</label>
                    <input type="time" id="reminderTime">
                </div>

                <div class="form-group">
                    <label>REPEAT</label>
                    <select id="reminderRepeat">
                        <option value="once">ONCE</option>
                        <option value="daily">DAILY</option>
                        <option value="weekly">WEEKLY</option>
                        <option value="weekdays">WEEKDAYS</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>NOTES (OPTIONAL)</label>
                    <input type="text" id="reminderNotes" placeholder="Add any notes...">
                </div>

                <button id="addReminder">ADD REMINDER</button>
                <p id="addMsg" style="margin-top:10px;"></p>
            </div>

            <div class="reminders-list card">
                <h3 style="font-family:'Orbitron'; color:#bc6ff1;">YOUR REMINDERS</h3>
                <div id="remindersList">
                    <p style="color:#888;">No reminders set yet.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="reminders.js"></script>
    <script>
        onAuthStateChange(async u => {
            if (!u) location.href = 'index.html';
        });
        document.getElementById('logout').onclick = async () => { await signOutUser(); location.href='index.html'; };
    </script>
</body>
</html>
