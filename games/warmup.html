<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>SYSTEM | ACTIVE MOTION SYNC</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Archivo Black', sans-serif; overflow: hidden; }
        .watermark-grid { position: fixed; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); pointer-events: none; z-index: 10; opacity: 0.12; }
        .watermark-text { font-size: 11px; display: flex; align-items: center; justify-content: center; letter-spacing: 2px; text-transform: uppercase; text-align: center; color: #333; }
        #instruction-layer { position: fixed; top: 15%; left: 50%; transform: translateX(-50%); text-align: center; z-index: 100; pointer-events: none; width: 100%; }
        .main-cmd { font-size: clamp(50px, 12vw, 150px); font-weight: 900; margin: 0; text-transform: uppercase; letter-spacing: -2px; line-height: 0.8; }
        #timer-box { font-size: 60px; color: #fff; margin-top: 10px; font-family: monospace; }
        #status-msg { font-size: 18px; color: #00d4ff; letter-spacing: 3px; font-weight: bold; margin-bottom: 10px; }
        #transition-screen { display: none; position: fixed; inset: 0; background: #000; z-index: 500; flex-direction: column; align-items: center; justify-content: center; }
        .success-text { font-size: 80px; text-shadow: 0 0 30px #fff; }
        #cv { width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); }
        .sync-container { position: fixed; bottom: 0; left: 0; width: 100%; height: 10px; background: rgba(255,255,255,0.05); z-index: 100; }
        #sync-fill { height: 100%; width: 0%; background: #00d4ff; transition: width 0.1s linear; }
        #inventory { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; flex-direction: column; align-items: center; justify-content: center; }
        .app-grid { display: grid; grid-template-columns: repeat(3, 110px); gap: 20px; }
        .app-card { background: #000; border: 1px solid #fff; padding: 15px; text-decoration: none; color: white; text-align: center; font-size: 12px; }
        .app-card img { width: 40px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="watermark-grid" id="wm-grid"></div>
<div id="transition-screen"><h1 class="success-text">STEP COMPLETE</h1></div>

<div id="instruction-layer">
    <div id="status-msg">WAITING FOR ACTION...</div>
    <h1 class="main-cmd" id="big-text">GET READY</h1>
    <div id="timer-box">5</div>
</div>

<canvas id="cv"></canvas>
<div class="sync-container"><div id="sync-fill"></div></div>

<div id="inventory">
    <h1 style="letter-spacing: 10px; margin-bottom: 30px;">SYSTEM UNLOCKED</h1>
    <div class="app-grid">
        <a href="https://instagram.com" target="_blank" class="app-card"><img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg"><div>INSTA</div></a>
        <a href="https://youtube.com" target="_blank" class="app-card"><img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg"><div>YT</div></a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>



<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let currentStep = 0, timeLeft = 5, isPaused = false, isCorrectPose = false;

const routine = [
    { big: "HANDS UP", id: "HI" },
    { big: "T-POSE", id: "TPOSE" },
    { big: "SQUAT", id: "SQUAT" },
    { big: "CLAP", id: "CLAP" }
];

// Logic to check if the user is doing the specific warmup
function checkPose(lm) {
    const head = lm[0], lWrist = lm[15], rWrist = lm[16], lElbow = lm[13], rElbow = lm[14], lShoulder = lm[11], rShoulder = lm[12], lHip = lm[23];

    switch(routine[currentStep].id) {
        case "HI": // Hand above head
            return (lWrist.y < head.y || rWrist.y < head.y);
        
        case "TPOSE": // Arms out to sides
            return (Math.abs(lWrist.y - lShoulder.y) < 0.1 && Math.abs(rWrist.y - rShoulder.y) < 0.1);
        
        case "SQUAT": // Head height drops significantly relative to hips
            return (head.y > lShoulder.y + 0.1);

        case "CLAP": // Hands close to each other in front of chest
            const dist = Math.sqrt(Math.pow(lWrist.x - rWrist.x, 2) + Math.pow(lWrist.y - rWrist.y, 2));
            return (dist < 0.15);
            
        default: return false;
    }
}

function showTransition() {
    isPaused = true;
    document.getElementById('transition-screen').style.display = 'flex';
    setTimeout(() => {
        document.getElementById('transition-screen').style.display = 'none';
        isPaused = false;
        timeLeft = 5;
        currentStep++;
        if (currentStep >= routine.length) {
            document.getElementById('inventory').style.display = 'flex';
        } else {
            document.getElementById('big-text').innerText = routine[currentStep].big;
        }
    }, 1500);
}

setInterval(() => {
    if (isPaused || !isCorrectPose) {
        document.getElementById('status-msg').innerText = isCorrectPose ? "KEEP GOING!" : "DO THE MOTION!";
        document.getElementById('status-msg').style.color = isCorrectPose ? "#00ff88" : "#ff3333";
        return;
    }
    
    timeLeft--;
    document.getElementById('timer-box').innerText = timeLeft;
    document.getElementById('sync-fill').style.width = ((5 - timeLeft) / 5 * 100) + "%";

    if(timeLeft <= 0) {
        showTransition();
    }
}, 1000);

const pose = new Pose({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}` });
pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5 });

pose.onResults((results) => {
    ctx.save();
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, cv.width, cv.height);
    
    if (results.poseLandmarks && !isPaused) {
        const landmarks = results.poseLandmarks;
        isCorrectPose = checkPose(landmarks);

        document.getElementById('big-text').innerText = routine[currentStep].big;
        
        ctx.translate(cv.width, 0); ctx.scale(-1, 1);
        ctx.strokeStyle = isCorrectPose ? "#00ff88" : "white"; 
        ctx.lineWidth = 8; 
        ctx.lineCap = "round";
        ctx.shadowBlur = isCorrectPose ? 20 : 0; 
        ctx.shadowColor = "#00ff88";
        
        const connections = [[11,12], [11,13], [13,15], [12,14], [14,16], [11,23], [12,24], [23,24]];
        connections.forEach(([i, j]) => {
            ctx.beginPath();
            ctx.moveTo(landmarks[i].x * cv.width, landmarks[i].y * cv.height);
            ctx.lineTo(landmarks[j].x * cv.width, landmarks[j].y * cv.height);
            ctx.stroke();
        });
    } else {
        isCorrectPose = false;
    }
    ctx.restore();
});

const camera = new Camera(document.createElement('video'), {
    onFrame: async () => {
        cv.width = window.innerWidth; cv.height = window.innerHeight;
        await pose.send({ image: camera.video });
    },
    width: 1280, height: 720
});
camera.start();
</script>
</body>
</html>
