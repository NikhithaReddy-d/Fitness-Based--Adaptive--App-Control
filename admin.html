<!doctype html>
<html>
<head>
    <title>Admin Panel - System Access</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase.js"></script>

    <div class="nav-header">
        <div class="brand" style="font-family:'Orbitron'; color:#00d4ff;">ADMIN PANEL</div>
        <div class="nav-links">
            <a href="menu.html" class="nav-link">MENU</a>
            <a href="dashboard.html" class="nav-link">DASHBOARD</a>
            <a href="profile.html" class="nav-link">PROFILE</a>
            <a href="activity.html" class="nav-link">ACTIVITY</a>
            <a href="history.html" class="nav-link">HISTORY</a>
            <a href="reminders.html" class="nav-link">REMINDERS</a>
            <a href="admin.html" class="nav-link active">ADMIN</a>
            <button id="logout" style="clip-path:none; padding:5px 15px;">LOGOUT</button>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="admin-container">
            <div class="admin-stats card">
                <h2 style="font-family:'Orbitron'; color:#00d4ff;">SYSTEM OVERVIEW</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3 style="color:#bc6ff1;">TOTAL USERS</h3>
                        <div class="stat-value" id="totalUsers">0</div>
                    </div>
                    <div class="stat-card">
                        <h3 style="color:#00d4ff;">ACTIVE USERS</h3>
                        <div class="stat-value" id="activeUsers">0</div>
                    </div>
                    <div class="stat-card">
                        <h3 style="color:#00ff88;">TOTAL ACTIVITIES</h3>
                        <div class="stat-value" id="totalActivities">0</div>
                    </div>
                </div>
            </div>

            <div class="user-management card">
                <h3 style="font-family:'Orbitron'; color:#bc6ff1;">USER MANAGEMENT</h3>
                <div class="search-box">
                    <input type="text" id="searchUsers" placeholder="Search by email or name...">
                    <button id="searchBtn">SEARCH</button>
                </div>
                <div id="usersList">
                    <p style="color:#888;">Loading users...</p>
                </div>
            </div>

            <div class="system-logs card">
                <h3 style="font-family:'Orbitron'; color:#00d4ff;">RECENT ACTIVITY LOGS</h3>
                <div id="activityLogs">
                    <p style="color:#888;">No recent activity.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="admin.js"></script>
    <script>
        onAuthStateChange(async u => {
            if (!u) location.href = 'index.html';
            // Check if user is admin
            const doc = await getUserDoc(u.uid);
            if (!doc || !doc.isAdmin) {
                alert('Access Denied: Admin privileges required');
                location.href = 'menu.html';
            }
        });
        document.getElementById('logout').onclick = async () => { await signOutUser(); location.href='index.html'; };
    </script>
</body>
</html>
