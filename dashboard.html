<!doctype html>
<html>
<head>
    <title>Dashboard - System Access</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase.js"></script>

    <div class="nav-header">
        <div class="brand" style="font-family:'Orbitron'; color:#00d4ff;">SYSTEM DASHBOARD</div>
        <div class="nav-links">
            <a href="menu.html" class="nav-link">MENU</a>
            <a href="dashboard.html" class="nav-link active">DASHBOARD</a>
            <a href="profile.html" class="nav-link">PROFILE</a>
            <a href="activity.html" class="nav-link">ACTIVITY</a>
            <a href="history.html" class="nav-link">HISTORY</a>
            <a href="reminders.html" class="nav-link">REMINDERS</a>
            <a href="admin.html" class="nav-link">ADMIN</a>
            <button id="logout" style="clip-path:none; padding:5px 15px;">LOGOUT</button>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="dashboard-container">
            <div class="welcome-section">
                <h2 style="font-family:'Orbitron'; color:#00d4ff;">WELCOME, <span id="userName">HUNTER</span></h2>
                <p style="color:#888;">System Status: ONLINE</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card card">
                    <h3 style="color:#bc6ff1;">LEVEL</h3>
                    <div class="stat-value" id="userLevel">1</div>
                </div>
                <div class="stat-card card">
                    <h3 style="color:#00d4ff;">TOTAL SCORE</h3>
                    <div class="stat-value" id="totalScore">0</div>
                </div>
                <div class="stat-card card">
                    <h3 style="color:#00ff88;">ACTIVITIES</h3>
                    <div class="stat-value" id="activityCount">0</div>
                </div>
                <div class="stat-card card">
                    <h3 style="color:#ffaa00;">REMINDERS</h3>
                    <div class="stat-value" id="reminderCount">0</div>
                </div>
            </div>

            <div class="quick-actions">
                <h3 style="font-family:'Orbitron'; color:#00d4ff; margin-bottom:20px;">QUICK ACTIONS</h3>
                <div class="action-buttons">
                    <button onclick="location.href='menu.html'">START QUEST</button>
                    <button onclick="location.href='activity.html'">LOG ACTIVITY</button>
                    <button onclick="location.href='profile.html'">VIEW PROFILE</button>
                    <button onclick="location.href='reminders.html'">SET REMINDER</button>
                </div>
            </div>

            <div class="recent-activity card">
                <h3 style="font-family:'Orbitron'; color:#bc6ff1;">RECENT ACTIVITIES</h3>
                <div id="recentActivities">
                    <p style="color:#888;">No recent activities recorded.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="dashboard.js"></script>
    <script>
        onAuthStateChange(async u => {
            if (!u) location.href = 'index.html';
        });
        document.getElementById('logout').onclick = async () => { await signOutUser(); location.href='index.html'; };
    </script>
</body>
</html>
