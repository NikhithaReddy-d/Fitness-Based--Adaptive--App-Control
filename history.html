<!doctype html>
<html>
<head>
    <title>History - System Access</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase.js"></script>

    <div class="nav-header">
        <div class="brand" style="font-family:'Orbitron'; color:#00d4ff;">ACTIVITY HISTORY</div>
        <div class="nav-links">
            <a href="menu.html" class="nav-link">MENU</a>
            <a href="dashboard.html" class="nav-link">DASHBOARD</a>
            <a href="profile.html" class="nav-link">PROFILE</a>
            <a href="activity.html" class="nav-link">ACTIVITY</a>
            <a href="history.html" class="nav-link active">HISTORY</a>
            <a href="reminders.html" class="nav-link">REMINDERS</a>
            <a href="admin.html" class="nav-link">ADMIN</a>
            <button id="logout" style="clip-path:none; padding:5px 15px;">LOGOUT</button>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="history-container">
            <div class="history-filters card">
                <h3 style="font-family:'Orbitron'; color:#00d4ff;">FILTER ACTIVITIES</h3>
                <div class="filter-row">
                    <select id="filterType">
                        <option value="">ALL TYPES</option>
                        <option value="running">RUNNING</option>
                        <option value="walking">WALKING</option>
                        <option value="cycling">CYCLING</option>
                        <option value="swimming">SWIMMING</option>
                        <option value="workout">WORKOUT</option>
                        <option value="yoga">YOGA</option>
                        <option value="stretching">STRETCHING</option>
                        <option value="other">OTHER</option>
                    </select>
                    <select id="filterDate">
                        <option value="all">ALL TIME</option>
                        <option value="today">TODAY</option>
                        <option value="week">THIS WEEK</option>
                        <option value="month">THIS MONTH</option>
                    </select>
                    <button id="applyFilter">APPLY</button>
                </div>
            </div>

            <div class="history-stats card">
                <h3 style="font-family:'Orbitron'; color:#bc6ff1;">OVERALL STATISTICS</h3>
                <div class="stats-row">
                    <div class="stat-item">
                        <span class="stat-label">TOTAL ACTIVITIES</span>
                        <span class="stat-value" id="totalActivities" style="color:#00d4ff;">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">TOTAL TIME</span>
                        <span class="stat-value" id="totalTime" style="color:#00ff88;">0 min</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">AVG DURATION</span>
                        <span class="stat-value" id="avgDuration" style="color:#ffaa00;">0 min</span>
                    </div>
                </div>
            </div>

            <div class="history-list card">
                <h3 style="font-family:'Orbitron'; color:#00d4ff;">ACTIVITY LOG</h3>
                <div id="historyList">
                    <p style="color:#888;">No activities recorded yet.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="history.js"></script>
    <script>
        onAuthStateChange(async u => {
            if (!u) location.href = 'index.html';
        });
        document.getElementById('logout').onclick = async () => { await signOutUser(); location.href='index.html'; };
    </script>
</body>
</html>
