<!doctype html>
<html>
<head>
    <title>Activity - System Access</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase.js"></script>

    <div class="nav-header">
        <div class="brand" style="font-family:'Orbitron'; color:#00d4ff;">ACTIVITY TRACKER</div>
        <div class="nav-links">
            <a href="menu.html" class="nav-link">MENU</a>
            <a href="dashboard.html" class="nav-link">DASHBOARD</a>
            <a href="profile.html" class="nav-link">PROFILE</a>
            <a href="activity.html" class="nav-link active">ACTIVITY</a>
            <a href="history.html" class="nav-link">HISTORY</a>
            <a href="reminders.html" class="nav-link">REMINDERS</a>
            <a href="admin.html" class="nav-link">ADMIN</a>
            <button id="logout" style="clip-path:none; padding:5px 15px;">LOGOUT</button>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="activity-container">
            <div class="activity-form card">
                <h2 style="font-family:'Orbitron'; color:#00d4ff;">LOG NEW ACTIVITY</h2>
                
                <div class="form-group">
                    <label>ACTIVITY TYPE</label>
                    <select id="activityType">
                        <option value="running">RUNNING</option>
                        <option value="walking">WALKING</option>
                        <option value="cycling">CYCLING</option>
                        <option value="swimming">SWIMMING</option>
                        <option value="workout">WORKOUT</option>
                        <option value="yoga">YOGA</option>
                        <option value="stretching">STRETCHING</option>
                        <option value="other">OTHER</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>DURATION (MINUTES)</label>
                    <input type="number" id="activityDuration" placeholder="Enter duration in minutes" min="1">
                </div>

                <div class="form-group">
                    <label>INTENSITY</label>
                    <select id="activityIntensity">
                        <option value="low">LOW</option>
                        <option value="medium">MEDIUM</option>
                        <option value="high">HIGH</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>NOTES (OPTIONAL)</label>
                    <input type="text" id="activityNotes" placeholder="Add any notes...">
                </div>

                <button id="logActivity">LOG ACTIVITY</button>
                <p id="logMsg" style="margin-top:10px;"></p>
            </div>

            <div class="today-activities card">
                <h3 style="font-family:'Orbitron'; color:#bc6ff1;">TODAY'S ACTIVITIES</h3>
                <div id="todayActivities">
                    <p style="color:#888;">No activities logged today.</p>
                </div>
            </div>

            <div class="weekly-summary card">
                <h3 style="font-family:'Orbitron'; color:#00d4ff;">WEEKLY SUMMARY</h3>
                <div id="weeklySummary">
                    <div class="summary-stat">
                        <span>TOTAL TIME:</span>
                        <span id="totalWeeklyTime" style="color:#00d4ff;">0 min</span>
                    </div>
                    <div class="summary-stat">
                        <span>ACTIVITIES:</span>
                        <span id="weeklyActivityCount" style="color:#00ff88;">0</span>
                    </div>
                    <div class="summary-stat">
                        <span>CALORIES (EST):</span>
                        <span id="weeklyCalories" style="color:#ffaa00;">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="activity.js"></script>
    <script>
        onAuthStateChange(async u => {
            if (!u) location.href = 'index.html';
        });
        document.getElementById('logout').onclick = async () => { await signOutUser(); location.href='index.html'; };
    </script>
</body>
</html>
